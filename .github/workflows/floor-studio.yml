name: Floor Studio source build
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: floor-studio/neonplan3d-main/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact audit parser dependencies
        run: npm ci
      - name: Install exact frontend dependencies
        run: npm ci --prefix floor-studio/neonplan3d-main/frontend
      - name: HACS stable distribution and public source checks
        run: npm run validate
      - name: Gate regression tests before generating build evidence
        run: python -m unittest discover -s floor-studio/tests -p 'test_*.py'
      - name: Frontend and four-module tests
        run: npm test
      - name: Typecheck, build and package candidate
        run: npm run build
      - name: Music, platform, editor and five-mode renderer browser checks with isolated fixtures
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Verify migration compatibility contract
        run: node scripts/check-neonplan-migration-contract.mjs
      - name: Package separate HACS integration candidate
        run: node scripts/package-hacs-integration-candidate.mjs
      - name: Verify packaged integration layout and checksums
        run: node scripts/verify-hacs-integration-candidate.mjs
      - name: Verify committed bundles are reproducible
        run: git diff --exit-code -- floor-studio/neonplan3d-main/custom_components/neonplan3d/frontend floor-studio/neonplan3d-main/site/import/neonplan-import.js
      - name: Report readiness without claiming Home Assistant validation
        run: |
          if npm run readiness > build/readiness.txt 2>&1; then
            cat build/readiness.txt >> "$GITHUB_STEP_SUMMARY"
          else
            cat build/readiness.txt >> "$GITHUB_STEP_SUMMARY"
            echo 'Source build only. Stable HACS distribution preserved; candidate is NOT approved for installation.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: floor-studio-build-candidate
          path: |
            build/floor-studio-candidate
            build/neonplan3d-hacs-integration-candidate
            build/readiness.txt
            build/music-browser
            build/platform-browser
            build/floor-browser
            build/editor-browser
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floor-studio/neonplan3d-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements_test.txt
      - run: pytest -q
