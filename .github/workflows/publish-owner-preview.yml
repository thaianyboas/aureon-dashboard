name: Publish AUREON dashboard to HACS master
# AUREON Noir (noir/) is the HACS dashboard since 2026-11-16. This job rebuilds dist/ from noir/,
# runs the unit and real-browser checks and commits the bundle only when it changed.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-owner-preview.yml'
      - 'noir/**'
      - 'floor-studio/dashboard/music/controller.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aureon-owner-preview
  cancel-in-progress: false
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:noir
      - run: node --test noir/tests/*.test.mjs
      - run: CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/test-noir-browser.mjs
      - run: node scripts/validate-distribution.mjs
      - name: Commit the rebuilt bundle when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/aureon-dashboard.js scripts/stable-dashboard.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build(hacs): rebuild AUREON Noir bundle"
            git push origin HEAD:master
          fi
