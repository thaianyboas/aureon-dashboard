blueprint:
  name: AUREON · Alexa avisa o fim do ciclo (tomada com medição)
  description: >
    A Alexa anuncia quando a máquina termina, usando o consumo de uma tomada com medição
    (para máquinas sem integração própria). A máquina conta como "ligada" quando passa do
    consumo de trabalho e como "terminou" quando fica abaixo do consumo de repouso pelo tempo escolhido.
    Funciona com a integração Alexa Devices (já vem no Home Assistant) ou com a Alexa Media Player.
  domain: automation
  source_url: https://github.com/thaianyboas/aureon-dashboard/blob/master/blueprints/automation/aureon/appliance_done_power.yaml
  input:
    power_entity:
      name: Sensor de potência da tomada (W)
      selector:
        entity:
          domain: sensor
          device_class: power
    running_w:
      name: Trabalhando acima de (W)
      default: 20
      selector:
        number: {min: 1, max: 3000, unit_of_measurement: W}
    idle_w:
      name: Em repouso abaixo de (W)
      default: 5
      selector:
        number: {min: 0, max: 500, unit_of_measurement: W}
    idle_minutes:
      name: Minutos em repouso para considerar "terminou"
      default: 5
      selector:
        number: {min: 1, max: 60, unit_of_measurement: min}
    speakers:
      name: Alexas que anunciam
      description: >
        Integração "Alexa Devices" (já vem com o Home Assistant): escolha as entidades que terminam em
        "Anunciar" / "Ankündigen" / "Announce". Integração Alexa Media Player (HACS): escolha a Echo.
      selector:
        entity:
          multiple: true
          filter:
            - integration: alexa_devices
              domain: notify
            - integration: alexa_media
              domain: media_player
    message:
      name: Mensagem
      default: A lava-louças terminou.
      selector:
        text: {}
    announce_volume:
      name: Volume do aviso
      description: >
        A Alexa fala neste volume só para este aviso e depois volta ao volume que estava. 0 = não mexer
        no volume (fala no volume atual). Funciona com a Echo como media player (Alexa Devices recente
        ou Alexa Media Player).
      default: 60
      selector:
        number: {min: 0, max: 100, step: 5, unit_of_measurement: "%", mode: slider}
    quiet_start:
      name: Silêncio a partir de
      default: "22:00:00"
      selector:
        time: {}
    quiet_end:
      name: Silêncio até
      default: "07:30:00"
      selector:
        time: {}
mode: single
max_exceeded: silent
variables:
  speakers: !input speakers
  announce_volume: !input announce_volume
  message_text: !input message
triggers:
  - trigger: numeric_state
    entity_id: !input power_entity
    above: !input running_w
    for:
      minutes: 2
actions:
  # "Executar ações" (teste manual) fala na hora; de verdade, espera a máquina ficar em repouso.
  - variables:
      manual: "{{ trigger is not defined or (trigger.platform | default(none)) is none }}"
  - wait_for_trigger:
      - trigger: numeric_state
        entity_id: !input power_entity
        below: !input idle_w
        for:
          minutes: !input idle_minutes
    timeout: "{{ '00:00:00' if manual else '08:00:00' }}"
    continue_on_timeout: true
  - condition: template
    value_template: "{{ manual or wait.trigger is not none }}"
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ manual }}"
      - condition: not
        conditions:
          - condition: time
            after: !input quiet_start
            before: !input quiet_end
  - variables:
      alexa_notify: "{{ speakers | select('match', '^notify\\.') | list }}"
      alexa_media: "{{ speakers | select('match', '^media_player\\.') | list }}"
      # The Echo(s) as media players: the chosen ones, or the media player of the same device as each
      # "Anunciar" entity. Only these get the temporary volume.
      vol_players: >
        {% set ns = namespace(p=[]) %}
        {% for s in speakers %}
          {% if s.startswith('media_player.') %}{% set ns.p = ns.p + [s] %}
          {% else %}{% set d = device_id(s) %}{% if d %}{% set ns.p = ns.p + (device_entities(d) | select('match', '^media_player\\.') | list) %}{% endif %}{% endif %}
        {% endfor %}
        {{ ns.p | unique | list if (announce_volume | float(0)) > 0 else [] }}
      old_volumes: >
        {% set ns = namespace(v={}) %}
        {% for p in vol_players %}{% set x = state_attr(p, 'volume_level') %}
          {% if x is number %}{% set ns.v = dict(ns.v, **{p: x}) %}{% endif %}
        {% endfor %}
        {{ ns.v }}
  # Only Echos whose current volume Home Assistant knows get the temporary volume, so it can always be put back.
  - if:
      - condition: template
        value_template: "{{ old_volumes | count > 0 }}"
    then:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ old_volumes | list }}"
        data:
          volume_level: "{{ (announce_volume | float(60)) / 100 }}"
      - delay: "00:00:01"
  - if:
      - condition: template
        value_template: "{{ alexa_notify | count > 0 }}"
    then:
      - action: notify.send_message
        target:
          entity_id: "{{ alexa_notify }}"
        data:
          message: !input message
  - if:
      - condition: template
        value_template: "{{ alexa_media | count > 0 }}"
    then:
      - action: notify.alexa_media
        data:
          message: !input message
          target: "{{ alexa_media }}"
          data:
            type: announce
  # Back to the volume it had before (only where Home Assistant knew it).
  - if:
      - condition: template
        value_template: "{{ old_volumes | count > 0 }}"
    then:
      - delay:
          seconds: "{{ (6 + (message_text | length) / 14) | int }}"
      - repeat:
          for_each: "{{ old_volumes | list }}"
          sequence:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item }}"
              data:
                volume_level: "{{ old_volumes[repeat.item] }}"
