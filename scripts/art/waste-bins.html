<!doctype html><meta charset="utf-8"><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const W=720,H=900,r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.0;r.shadowMap.enabled=true;
document.body.append(r.domElement);
const recycle=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=18;g.lineCap='round';g.lineJoin='round';
 const V=[[128,40],[214,190],[42,190]];
 for(let i=0;i<3;i++){const [ax,ay]=V[i],[bx,by]=V[(i+1)%3],dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  const p=f=>[ax+dx*f,ay+dy*f],[sx,sy]=p(.16),[ex,ey]=p(.7);g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.stroke();
  const tip=p(.86);g.beginPath();g.moveTo(tip[0],tip[1]);g.lineTo(ex+nx*22,ey+ny*22);g.lineTo(ex-nx*22,ey-ny*22);g.closePath();g.fill();}
 const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return t;})();
window.renderBin=(body,lid,symbol)=>{
 const s=new T.Scene(),pm=new T.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;s.environmentIntensity=.55;
 const cam=new T.PerspectiveCamera(26,W/H,.1,50);cam.position.set(-1.35,1.25,2.6);cam.lookAt(0,.56,0);
 const plastic=c=>new T.MeshPhysicalMaterial({color:c,roughness:.42,metalness:0,clearcoat:.35,clearcoatRoughness:.35});
 // tapered body
 const g=new RoundedBoxGeometry(.62,1.0,.72,6,.07);const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i),k=.86+.14*((y+.5));p.setX(i,p.getX(i)*k);p.setZ(i,p.getZ(i)*k);}g.computeVertexNormals();
 const bodyM=new T.Mesh(g,plastic(body));bodyM.position.y=.56;bodyM.castShadow=true;s.add(bodyM);
 // ribs on the sides
 for(const x of [-1,1])for(let k=0;k<3;k++){const rib=new T.Mesh(new T.BoxGeometry(.012,.62,.05),plastic(body));rib.position.set(x*(.3+.04*.5),.52,-.18+k*.18);rib.rotation.z=x*-.07;s.add(rib);}
 // lid with overhang and front lip
 const lidM=new T.Mesh(new RoundedBoxGeometry(.7,.07,.82,4,.03),plastic(lid));lidM.position.set(0,1.09,.02);lidM.castShadow=true;s.add(lidM);
 const lip=new T.Mesh(new RoundedBoxGeometry(.3,.05,.06,3,.02),plastic(lid));lip.position.set(0,1.075,.44);s.add(lip);
 // rim under the lid
 const rim=new T.Mesh(new RoundedBoxGeometry(.68,.06,.78,3,.03),plastic(body));rim.position.y=1.03;s.add(rim);
 // handle bar at the back and wheels
 const bar=new T.Mesh(new T.CylinderGeometry(.025,.025,.6,24),plastic(lid));bar.rotation.z=Math.PI/2;bar.position.set(0,1.0,-.43);s.add(bar);
 for(const x of [-.27,.27]){const w=new T.Mesh(new T.CylinderGeometry(.1,.1,.06,40),new T.MeshPhysicalMaterial({color:0x151515,roughness:.6}));w.rotation.z=Math.PI/2;w.position.set(x,.1,-.3);w.castShadow=true;s.add(w);const hub=new T.Mesh(new T.CylinderGeometry(.04,.04,.065,24),new T.MeshStandardMaterial({color:0x3a3a3a,roughness:.5}));hub.rotation.z=Math.PI/2;hub.position.copy(w.position);s.add(hub);}
 // front symbol following the taper of the front face
 if(symbol){const d=new T.Mesh(new T.PlaneGeometry(.34,.34),new T.MeshStandardMaterial({map:recycle,transparent:true,roughness:.5,opacity:.92}));const tilt=Math.atan2(.36*.14,1);d.position.set(0,.6,.36*(.86+.14*.54)+.004);d.rotation.x=-tilt;s.add(d);}
 const ground=new T.Mesh(new T.PlaneGeometry(6,6),new T.ShadowMaterial({opacity:.38}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;s.add(ground);
 const key=new T.DirectionalLight(0xfff4e2,2.4);key.position.set(-2,4,3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-1.5;key.shadow.camera.right=1.5;key.shadow.camera.top=1.5;key.shadow.camera.bottom=-1.5;s.add(key);
 const rimL=new T.DirectionalLight(0xffe2b0,1.2);rimL.position.set(2.5,1.5,-2);s.add(rimL);s.add(new T.HemisphereLight(0xffffff,0x303030,.4));
 r.render(s,cam);return r.domElement.toDataURL('image/png');};
window.ready=true;
</script>
