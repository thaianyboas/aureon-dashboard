<!doctype html><meta charset="utf-8"><body style="margin:0;background:transparent">

<script type="module">
// A slim round robot vacuum in the style of the owner's own robot (matte graphite top, raised navigation turret with a
// brushed champagne cap and blue ring, stereo camera window at the front, ribbed rear rim). No logo or brand marks.
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const W=1400,H=900,r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.1;r.shadowMap.enabled=true;
document.body.append(r.domElement);
const s=new T.Scene(),pm=new T.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;s.environmentIntensity=.55;
const cam=new T.PerspectiveCamera(22,W/H,.1,50);cam.position.set(1.0,1.5,5.2);cam.lookAt(-.12,.18,0);
const add=(g,m,x=0,y=0,z=0)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;s.add(o);return o;};
const top=new T.MeshPhysicalMaterial({color:0x2a2b2e,roughness:.62,metalness:.05,clearcoat:.15,clearcoatRoughness:.6});
const side=new T.MeshPhysicalMaterial({color:0x141517,roughness:.5,metalness:.1,clearcoat:.3,clearcoatRoughness:.4});
const glass=new T.MeshPhysicalMaterial({color:0x050607,roughness:.08,metalness:.2,clearcoat:1});
const brushed=new T.MeshPhysicalMaterial({color:0xd6c39b,roughness:.28,metalness:1});
const blue=new T.MeshStandardMaterial({color:0x2a8cff,emissive:0x2f8fff,emissiveIntensity:2.4});
const lathe=(pts,m,a=0,l=Math.PI*2)=>{m.side=T.DoubleSide;return add(new T.LatheGeometry(pts.map(([x,y])=>new T.Vector2(x,y)),180,a,l),m);};
// body: side wall and the flat top with a soft edge
lathe([[0,0.02],[0.9,0.02],[0.975,0.04],[1.0,0.09],[1.0,0.4]],side);
lathe([[1.0,0.4],[0.995,0.425],[0.975,0.44],[0.9,0.448],[0,0.448]],top);
// ribbed rim over the rear half
for(let i=0;i<150;i++){const a=Math.PI*0.62+i/149*Math.PI*1.1,rib=add(new T.BoxGeometry(.01,.016,.045),side);rib.position.set(Math.sin(a)*.975,.452,Math.cos(a)*.975);rib.rotation.y=a;}
// navigation turret near the front: black collar, raised cap, brushed champagne top, blue ring
const tz=.42;add(new T.CylinderGeometry(.23,.23,.012,96),glass,0,.452,tz);
add(new T.CylinderGeometry(.175,.18,.11,96),new T.MeshPhysicalMaterial({color:0x0c0d0f,roughness:.35,metalness:.2,clearcoat:.8}),0,.51,tz);
const ring=add(new T.TorusGeometry(.172,.009,16,160),blue,0,.565,tz);ring.rotation.x=Math.PI/2;
add(new T.CylinderGeometry(.165,.165,.012,128),brushed,0,.568,tz);
for(const k of [.05,.1,.135]){const g=add(new T.TorusGeometry(k,.0015,6,120),new T.MeshStandardMaterial({color:0xa99673,roughness:.4,metalness:1}),0,.5745,tz);g.rotation.x=Math.PI/2;}
// stereo camera window on the front of the wall, two lenses and a sensor in the middle
const win=add(new T.CylinderGeometry(1.004,1.004,.11,120,1,true,-Math.PI*.1,Math.PI*.2),glass,0,.24,0);
const lens=(x)=>{const a=Math.asin(x),o=add(new T.CylinderGeometry(.035,.035,.02,48),new T.MeshPhysicalMaterial({color:0x1b2a3a,roughness:.05,metalness:.6,clearcoat:1}));o.position.set(Math.sin(a)*1.012,.24,Math.cos(a)*1.012);o.rotation.x=Math.PI/2;o.rotation.z=0;o.lookAt(Math.sin(a)*3,.24,Math.cos(a)*3);o.rotateX(Math.PI/2);};
lens(-.17);lens(.17);
const sensor=add(new T.BoxGeometry(.12,.03,.01),new T.MeshStandardMaterial({color:0xcfd3d6,roughness:.3,metalness:.6}),0,.24,1.012);
// side brush pod at the front left with a gold hub
const pod=add(new RoundedBoxGeometry(.2,.1,.16,4,.03),side,-.82,.11,.62);pod.rotation.y=.9;
const hub=add(new T.CylinderGeometry(.035,.035,.03,32),new T.MeshStandardMaterial({color:0xc9922f,roughness:.35,metalness:.7}),-.92,.04,.78);
for(let i=0;i<3;i++){const arm=add(new T.CylinderGeometry(.006,.003,.32,8),new T.MeshStandardMaterial({color:0x1a1a1a,roughness:.8}));const a=i*Math.PI*2/3+.6;arm.position.set(-.92+Math.cos(a)*.16,.03,.78+Math.sin(a)*.16);arm.rotation.z=Math.PI/2;arm.rotation.y=-a;}
const ground=new T.Mesh(new T.PlaneGeometry(8,8),new T.ShadowMaterial({opacity:.4}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;s.add(ground);
const key=new T.DirectionalLight(0xfff3e0,2.6);key.position.set(2,5,3.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-2;key.shadow.camera.right=2;key.shadow.camera.top=2;key.shadow.camera.bottom=-2;s.add(key);
const rim=new T.DirectionalLight(0xffffff,1.3);rim.position.set(-3,2,-2);s.add(rim);s.add(new T.HemisphereLight(0xffffff,0x202020,.4));
r.render(s,cam);window.done=r.domElement.toDataURL('image/png');
</script>
